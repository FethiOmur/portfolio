name: Deploy to GitHub Pages

# Pages source = main branch /docs folder.
# On a source push, rebuild the static export into docs/ and commit it back.
# `paths-ignore: docs/**` prevents the docs commit from re-triggering this workflow.

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static export (-> docs/)
        env:
          GITHUB_PAGES: "true"
          BASE_PATH: "/portfolio"
          NEXT_PUBLIC_BASE_PATH: "/portfolio"
          NEXT_TELEMETRY_DISABLED: "1"
          CI: "true"
        run: npm run export

      - name: Commit and push docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "No docs/ changes to commit."
          else
            git commit -m "chore: rebuild docs [skip ci]"
            git push
          fi
