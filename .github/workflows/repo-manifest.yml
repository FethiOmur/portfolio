name: Update repo manifest

on:
  schedule:
    - cron: "17 4 * * 0" # weekly, Sunday 04:17 UTC — ahead of the projects routine
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build repo manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/build_repo_manifest.py

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/routine/repos-manifest.json; then
            echo "No changes to repo manifest."
          else
            git add docs/routine/repos-manifest.json
            git commit -m "chore: refresh repo manifest"
            git push
          fi
